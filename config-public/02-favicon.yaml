# Favicon for the PUBLIC status page only.
#
# Scoped here rather than in the shared 01-ui.yaml because `ui:` maps DO
# deep-merge across files in a config directory (verified 2026-09-14), so this
# adds a favicon to the public board without touching the internal one.
#
# These are URLs, not inline data: URIs, and that is forced rather than chosen.
# Gatus renders ui.favicon into an HTML href, and Go's html/template URL filter
# rejects the data: scheme outright -- the attribute comes out as the sentinel
# "#ZgotmplZ" and the icon silently disappears. Only http(s) and relative URLs
# survive. See brand/README.md.
#
# Note the white mark is transparent apart from the mark itself, so it is
# invisible against a light browser tab bar. That is inherent to a white-on-
# transparent icon; a version with a solid background would be needed to show
# in both.

ui:
  favicon:
    default: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-32.png"
    size16x16: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-16.png"
    size32x32: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-32.png"
