# Customer-facing services, grouped by client. Production and development sit
# together in each group so a client sees both of its environments in one place.
#
# Group order on the page is alphabetical: CSN-PR, CSN-UPV, Seed, Shared
# platform. The platform group is named to sort last on purpose.
#
# CONDITIONS ASSERT ON THE BODY, NOT JUST THE STATUS CODE. This is the rule that
# makes this file trustworthy. Every name under seedaps.com resolves and answers
# 200 because the zone carries a wildcard pointing at an unrelated Azure App
# Service, so `[STATUS] == 200` stays green for a hostname that does not exist.
# Verified 2026-09-11: a check for status.seedaps.com passed a status-only
# condition before that hostname had any DNS record. `[BODY] == Healthy` is what
# the wildcard cannot fake. Do not relax these.

announcements:
  - timestamp: 2026-09-11T19:00:00Z
    type: information
    message: >-
      This page reports the live health of Seed APS customer environments. Each
      client shows its production and development environments; a green
      indicator means the service answered an end-to-end request correctly,
      checked every 60 seconds for production and every 5 minutes for
      development.

endpoints:
  # ================================================================= CSN-PR
  - name: Portal
    group: CSN-PR
    url: "https://csnpr.coortex.com/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: Portal (dev)
    group: CSN-PR
    url: "https://csnpr.dev.coortex.com/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  # ================================================================ CSN-UPV
  - name: Portal
    group: CSN-UPV
    url: "https://csnupv.coortex.com/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: Portal (dev)
    group: CSN-UPV
    url: "https://csnupv.dev.coortex.com/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  - name: Planejamento
    group: CSN-UPV
    url: "https://planejamento.csn.seedaps.com/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: Planejamento (dev)
    group: CSN-UPV
    url: "https://planejamento.csn.dev.seedaps.com/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  # =================================================================== Seed
  - name: Tutorial Mesas
    group: Seed
    url: "https://tutorial-mesas.coortex.com/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"
      - "[CERTIFICATE_EXPIRATION] > 168h"

  - name: Tutorial Mesas (dev)
    group: Seed
    url: "https://tutorial-mesas.dev.coortex.com/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Healthy"

  # ======================================================== Shared platform
  #
  # The shared Azure App Service behind csnupv.seedaps.com,
  # csnupv.api.seedaps.com, csnpr.seedaps.com, csnpr.api.seedaps.com and
  # tutorial-mesas.seedaps.com. Its /api/health answers 401 when the API tier is
  # alive, which catches a 502/503 outage.
  #
  # It CANNOT distinguish one tenant from another. Eighteen paths were compared
  # against a control hostname on 2026-09-11 -- including /favicon.ico and
  # /robots.txt -- and every one was byte-identical. So it is listed once, named
  # for what it actually covers, rather than as five per-tenant lights that
  # would stay green if a tenant vanished.
  #
  # Conditions are hidden in the UI because "expects 401" reads as a fault to
  # anyone who does not know the above.
  - name: Login portal
    group: Shared platform
    url: "https://csnupv.seedaps.com/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    ui:
      hide-url: true
      hide-conditions: true
