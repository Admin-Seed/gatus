# Base configuration for the PUBLIC status page.
#
# Deliberately no `security:` block — this board is meant to be readable by
# customers without a credential. Keep it that way, and keep infrastructure
# endpoints out of config-public/ entirely: anything listed here is public.

storage:
  type: sqlite
  path: /data/data.db
  caching: true
  maximum-number-of-results: 100
  maximum-number-of-events: 50

# Deployed from git. A bad commit must not take the status page down.
skip-invalid-config-update: true
