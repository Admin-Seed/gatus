# Seed tenants on the shared multi-tenant application.
#
# READ THIS BEFORE CHANGING A CONDITION.
#
# Every one of these is a hostname under seedaps.com, and the zone carries a
# wildcard (F-052): a name that does NOT exist still resolves, still returns
# 200, and still renders a login page. `[STATUS] == 200` therefore proves
# nothing at all here -- it would stay green for a tenant that had been deleted,
# or for a hostname with a typo in it.
#
# What does discriminate: an unconfigured hostname renders
# "Endere&#231;o de empresa inexistente." inside an `alert-danger` box, and a
# configured tenant never does. Measured 2026-09-14 across all 33 tenants and
# four invented control hostnames:
#
#     "inexistente"   0/33 tenants   4/4 controls
#     "alert-danger"  0/33 tenants   4/4 controls
#
# Positive markers do NOT work -- seed_logo.png, azureClientID, logoFileName and
# wallpaperFileName all appear in the control pages too. Body hashing does not
# work either: the page carries per-request anti-forgery tokens, so two fetches
# of the same host differ.
#
# Hence the negative assertion below. It is the only thing standing between this
# group and 33 green lights that mean nothing.
#
# Interval is 2m rather than 60s: these are 33 checks against one shared App
# Service. The certificate condition is on every entry because they share one
# wildcard certificate -- if it lapses, 33 red is the correct answer.
#
# client.timeout is raised to 30s from the 10s default. On the first validation
# pass three tenants (focus-sp, inplavel, kingspan-anapolis) failed with
# "context deadline exceeded ... while awaiting headers" while a direct probe
# showed them healthy with a valid certificate. All 33 hit the same App Service
# at the same instant, and it is slow on cold paths. 10s produced false alarms;
# 30s does not. If these start timing out at 30s, that is a real performance
# problem rather than a monitoring artefact.

endpoints:
  - name: bblend
    group: seed
    url: "https://bblend.seedaps.com/"
    interval: 2m
    client:
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] != pat(*inexistente*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"

