# Infrastructure that is not an HTTP service of this host.
#
# n8n and signoz moved to `internal` on 2026-09-14, leaving this group holding
# the database gateway alone. Kept as its own group rather than folded in,
# because it is the one check here that is neither an application on this host
# nor a customer environment.

endpoints:
  # Azure SQL -- the WebJob's production database.
  #
  # Gatus has no database endpoint type, so this is a TLS handshake against the
  # Azure SQL gateway. Be honest about what it proves:
  #
  #   it DOES     detect the gateway being unreachable, DNS failure, and an
  #               expiring certificate;
  #   it does NOT prove the database is online, that it is not paused, that
  #               there is DTU headroom, or that any credential still works.
  #
  # Real database health belongs in an Azure Monitor metric alert (F-001,
  # F-039). No credential appears here -- this repository is public.
  - name: Azure SQL gateway (seedwebsql)
    group: infrastructure
    url: "tls://seedwebsql.database.windows.net:1433"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"
      - "[CERTIFICATE_EXPIRATION] > 168h"
