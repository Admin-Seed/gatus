# End-to-end checks through the full public path:
#   Cloudflare edge -> tunnel 7f851ded -> cloudflared -> the service.
# These are the highest-value checks here, because they exercise DNS, the
# Cloudflare Tunnel and the origin in one go.

endpoints:
  - name: signoz
    group: public
    url: "https://signoz.seedaps.com/api/v1/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: n8n
    group: public
    url: "https://n8n.seedaps.com/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  # Asserts on the BODY, not just the status. The *.seedaps.com wildcard makes
  # an unrouted hostname answer 200 from an unrelated Azure App Service, so a
  # status-only condition here would stay green even if this tunnel rule were
  # deleted. Gatus's own /health returns {"status":"UP"}, which the wildcard
  # cannot produce.
  - name: gatus (this page, via the tunnel)
    group: public
    url: "https://uptime.seedaps.com/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
