# Everything under `ui:` lives in this one file.
#
# GATUS_CONFIG_PATH=/config merges every *.yaml here, but only distinct
# top-level keys are relied on -- keeping the whole `ui:` map in a single file
# means nothing depends on how Gatus deep-merges a map across files.
#
# The logo is inlined as a data: URI rather than hot-linked from seed.com.br.
# It is 17 KB (23 KB as base64), and inlining means the status page has no
# third-party dependency on every load, leaks no visitor IPs, and keeps
# rendering correctly even if seed.com.br is the thing that is down.

ui:
  title: "Status | Seed APS"
  description: "Service health for Seed APS"
  header: "Seed APS"
  dashboard-heading: "Service status"
  dashboard-subheading: "Live health of the Seed APS platform"
  link: "https://seed.com.br"
  dark-mode: true
  default-sort-by: group
  logo: "data:image/png;base64,"
  custom-css: |
    /* Seed APS theme.
     *
     * Gatus's frontend is shadcn-style: every colour resolves through HSL custom
     * properties (e.g. .bg-background{background-color:hsl(var(--background))}), so
     * re-theming is a variable override rather than a fight with utility classes.
     *
     * Two things about this file are deliberate:
     *
     * 1. Selectors are doubled (:root:root = specificity 0,2,0). Gatus links
     *    /css/custom.css BEFORE /css/app.css, so a plain :root (0,1,0) would tie
     *    with app.css's own :root and lose on source order.
     * 2. The same palette is applied to :root and .dark. Gatus has no theme
     *    toggle -- the visitor's prefers-color-scheme alone decides -- and the Seed
     *    wordmark is solid white, so it would vanish on a light background. One
     *    palette means every visitor gets the same legible page.
     */
    :root:root,
    :root:root.dark {
      --background: 222 47% 8%;
      --foreground: 210 40% 96%;
      --card: 222 44% 12%;
      --card-foreground: 210 40% 96%;
      --popover: 222 44% 12%;
      --popover-foreground: 210 40% 96%;
      --primary: 210 90% 56%;
      --primary-foreground: 222 47% 8%;
      --secondary: 217 33% 18%;
      --secondary-foreground: 210 40% 96%;
      --muted: 217 33% 17%;
      --muted-foreground: 215 25% 68%;
      --accent: 217 40% 22%;
      --accent-foreground: 210 40% 98%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 210 40% 98%;
      --border: 217 33% 20%;
      --input: 217 33% 20%;
      --ring: 210 90% 56%;
      --radius: 0.75rem;
    }

    /* Page wash. #global carries .bg-background, which would paint flat over the
     * gradient, so it is made transparent -- an ID beats a utility class. */
    html:root body {
      background-color: hsl(222 47% 8%);
      background-image:
        radial-gradient(60rem 32rem at 12% -14%, hsl(214 90% 32% / 0.30), transparent 60%),
        radial-gradient(52rem 30rem at 92% 0%, hsl(198 85% 36% / 0.18), transparent 62%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    #global { background-color: transparent; }

    /* Header band. Kept a shade deeper than the cards so the white wordmark always
     * sits on dark, including while the translucent header scrolls over content. */
    #global header {
      background-color: hsl(222 52% 10% / 0.92);
      border-bottom: 1px solid hsl(210 90% 56% / 0.22);
    }

    /* The logo ships inside a 48x48 box (w-12 h-12) with object-contain, which
     * renders a 1080x509 wordmark at 48x23 -- unreadable. Release the box and let
     * the image take its natural aspect ratio. */
    #global header .w-12.h-12 { width: auto; height: 2.5rem; }
    #global header .w-12.h-12 img { width: auto; height: 100%; max-width: 12rem; object-fit: contain; }
    #global header h1 { letter-spacing: -0.02em; }

    /* "Powered by Gatus" is hard-coded text-emerald-800, which clashes with navy.
     * Recoloured, not hidden -- upstream attribution stays. */
    #global footer a[href*="gatus.io"] { color: hsl(215 25% 68%); }
    #global footer a[href*="gatus.io"]:hover { color: hsl(210 90% 56%); }
