# Shared branding for BOTH boards. config-public/01-ui.yaml is a git symlink to
# this file, and compose.public.yaml mounts the repository root, so there is
# exactly one definition of the logos, theme and favicon.
#
# `logo:` is deliberately NOT set. Gatus renders a single logo URL with no way
# to vary it by theme, and there are two marks -- black for light, white for
# dark. Both are inlined in custom-css as background-images instead, which also
# keeps the pages free of any third-party request on load.
#
# `favicon:` below is the opposite case, and the asymmetry is not a mistake.
# Gatus renders it into an HTML href, where Go's html/template rejects the
# `data:` scheme outright and substitutes the sentinel `#ZgotmplZ`, so the icon
# silently disappears. Only http(s) and relative URLs survive there. `ui.logo`
# escapes that filter only because it lands in a JavaScript string literal.
# See brand/README.md.

ui:
  title: "Status | Seed APS"
  description: "Service health for Seed APS"
  header: "Seed APS"
  dashboard-heading: "Service status"
  dashboard-subheading: "Live health of Seed APS environments"
  link: "https://seed.com.br"
  dark-mode: true
  default-sort-by: group

  # Served from raw.githubusercontent.com out of brand/ in this repository.
  # A third party, but not a new one -- Komodo already pulls this repo from
  # GitHub to deploy at all -- and a favicon that fails to load is cosmetic,
  # unlike the header logo. To make it first-party, host brand/* on seed.com.br
  # and change these three URLs.
  #
  # NOTE the mark is white on transparent, so it does not show against the light
  # tab bar most browsers use in light mode. Inherent to the asset; a variant
  # with a solid background would be needed to show in both.
  favicon:
    default: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-32.png"
    size16x16: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-16.png"
    size32x32: "https://raw.githubusercontent.com/Admin-Seed/gatus/main/brand/favicon-32.png"

  custom-css: |
    /* Seed APS theme.
     *
     * Gatus's frontend is shadcn-style: every colour resolves through HSL custom
     * properties (e.g. .bg-background{background-color:hsl(var(--background))}), so
     * re-theming means overriding variables, not chasing utility classes.
     *
     * Selectors are DOUBLED (:root:root = specificity 0,2,0) because Gatus links
     * /css/custom.css BEFORE /css/app.css -- a plain :root (0,1,0) would tie with
     * app.css's own :root and lose on source order.
     *
     * Both themes are supported. There is no theme switcher in the Gatus UI: the
     * visitor's prefers-color-scheme decides, and we cannot override that choice.
     * Since there is now a black logo and a white one, each theme gets the logo
     * that is legible against it (see the logo block at the bottom).
     */

    /* ---------- light ---------- */
    :root:root {
      --background: 210 40% 98%;
      --foreground: 222 47% 11%;
      --card: 0 0% 100%;
      --card-foreground: 222 47% 11%;
      --popover: 0 0% 100%;
      --popover-foreground: 222 47% 11%;
      --primary: 214 90% 42%;
      --primary-foreground: 0 0% 100%;
      --secondary: 214 32% 94%;
      --secondary-foreground: 222 47% 16%;
      --muted: 214 32% 94%;
      --muted-foreground: 215 20% 42%;
      --accent: 214 40% 92%;
      --accent-foreground: 222 47% 16%;
      --destructive: 0 72% 45%;
      --destructive-foreground: 0 0% 100%;
      --border: 214 25% 88%;
      --input: 214 25% 88%;
      --ring: 214 90% 42%;
      --radius: 0.75rem;
    }

    /* ---------- dark ---------- */
    :root:root.dark {
      --background: 222 47% 8%;
      --foreground: 210 40% 96%;
      --card: 222 44% 12%;
      --card-foreground: 210 40% 96%;
      --popover: 222 44% 12%;
      --popover-foreground: 210 40% 96%;
      --primary: 210 90% 56%;
      --primary-foreground: 222 47% 8%;
      --secondary: 217 33% 18%;
      --secondary-foreground: 210 40% 96%;
      --muted: 217 33% 17%;
      --muted-foreground: 215 25% 68%;
      --accent: 217 40% 22%;
      --accent-foreground: 210 40% 98%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 210 40% 98%;
      --border: 217 33% 20%;
      --input: 217 33% 20%;
      --ring: 210 90% 56%;
      --radius: 0.75rem;
    }

    /* Page wash. #global carries .bg-background, which would paint flat over the
     * gradient, so it is made transparent -- an ID beats a utility class. */
    html:root body {
      background-color: hsl(210 40% 98%);
      background-image:
        radial-gradient(60rem 32rem at 12% -14%, hsl(214 90% 60% / 0.10), transparent 60%),
        radial-gradient(52rem 30rem at 92% 0%, hsl(198 85% 55% / 0.08), transparent 62%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    html:root.dark body {
      background-color: hsl(222 47% 8%);
      background-image:
        radial-gradient(60rem 32rem at 12% -14%, hsl(214 90% 32% / 0.30), transparent 60%),
        radial-gradient(52rem 30rem at 92% 0%, hsl(198 85% 36% / 0.18), transparent 62%);
    }
    #global { background-color: transparent; }

    /* Header follows the theme, so the logo below always has contrast. */
    #global header {
      background-color: hsl(0 0% 100% / 0.86);
      border-bottom: 1px solid hsl(214 30% 86%);
    }
    #global header h1 { letter-spacing: -0.02em; }
    :root.dark #global header {
      background-color: hsl(222 52% 10% / 0.92);
      border-bottom: 1px solid hsl(210 90% 56% / 0.22);
    }

    /* "Powered by Gatus" is hard-coded text-emerald-800, which clashes.
     * Recoloured, not hidden -- upstream attribution stays. */
    #global footer a[href*="gatus.io"] { color: hsl(215 20% 42%); }
    :root.dark #global footer a[href*="gatus.io"] { color: hsl(215 25% 68%); }
    #global footer a[href*="gatus.io"]:hover { color: hsl(214 90% 42%); }

    /* ---------- theme-aware logo ----------
     * Gatus takes a single `ui.logo` URL and renders it as <img>, with no way to
     * vary it by theme. So `ui.logo` is left unset, the <img> Gatus renders (its
     * own fallback mark) is hidden, and the 48x48 container is painted with a
     * background-image instead -- black on light, white on dark.
     *
     * Both marks are square, so the default w-12/h-12 box is left at its natural
     * size and `contain` fits them exactly. An earlier revision stretched this box
     * for a 2.12:1 wordmark; that override is deliberately gone.
     */
    #global header .w-12.h-12 > img { display: none; }
    #global header .w-12.h-12 {
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      background-image: url("data:image/png;base64,");
    }
    :root.dark #global header .w-12.h-12 {
      background-image: url("data:image/png;base64,");
    }
