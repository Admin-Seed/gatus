# Services reached directly on the Docker host, plus the admin portal.
#
# Deliberately HTTP, never tcp://. netsh portproxy completes the TCP handshake
# before dialling the backend, so a TCP check against a forwarded port reads
# green forever even when nothing is listening behind it (F-027).

endpoints:
  - name: signoz (direct)
    group: internal
    url: "http://host.docker.internal:8080/api/v1/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  - name: komodo (direct)
    group: internal
    url: "http://host.docker.internal:9120/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"

  # Distinct application from the tenant login app -- its own title, and no
  # /health endpoint (that path 404s). The title assertion is what separates it
  # from a wildcard hit under seedaps.com.
  - name: portal admin
    group: internal
    url: "https://portal.seedaps.com/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Seed Web Admin*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
