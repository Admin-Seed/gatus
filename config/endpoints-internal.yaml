# The board itself, and the admin portal.
#
# The komodo and signoz direct checks were removed on 2026-09-14: both services
# are already covered from the outside in the `infrastructure` group, and the
# duplicate direct path was not earning its place on the board.

endpoints:
  # Gatus watching its own /health, over loopback inside its own container.
  #
  # This is a liveness check of the process, not of the path users take to reach
  # it -- if the tunnel or Cloudflare breaks, this stays green while the board is
  # unreachable. Nothing watches it from outside the VM (F-039).
  - name: gatus (self)
    group: internal
    url: "http://localhost:8080/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

  # A distinct application from the tenant login app -- its own title, and no
  # /health endpoint (that path 404s). The title assertion is what separates it
  # from a wildcard hit under seedaps.com.
  - name: portal admin
    group: internal
    url: "https://portal.seedaps.com/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Seed Web Admin*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
