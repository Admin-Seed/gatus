# The board itself, the admin portal, and the two services this host runs that
# are published through the tunnel.
#
# n8n and signoz moved here from `infrastructure` on 2026-09-14. Both are still
# checked end to end through Cloudflare -- the group name changed, the check did
# not.

endpoints:
  # Gatus watching its own /health, over loopback inside its own container.
  #
  # This is a liveness check of the process, not of the path users take to reach
  # it -- if the tunnel or Cloudflare breaks, this stays green while the board is
  # unreachable. Nothing watches it from outside the VM (F-039).
  - name: gatus (self)
    group: internal
    url: "http://localhost:8080/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"

  - name: n8n
    group: internal
    url: "https://n8n.seedaps.com/healthz"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: signoz
    group: internal
    url: "https://signoz.seedaps.com/api/v1/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[CERTIFICATE_EXPIRATION] > 240h"

  # A distinct application from the tenant login app -- its own title, and no
  # /health endpoint (that path 404s). The title assertion is what separates it
  # from a wildcard hit under seedaps.com.
  - name: portal admin
    group: internal
    url: "https://portal.seedaps.com/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Seed Web Admin*)"
      - "[CERTIFICATE_EXPIRATION] > 168h"
