# Public status page — a SECOND Gatus instance.
#
# Why two instances: Gatus has no per-endpoint visibility control, so a single
# dashboard is either entirely public or entirely authenticated. The internal
# board (compose.yaml, port 3001) keeps basic auth and watches infrastructure;
# this one is unauthenticated, published at status.seedaps.com, and shows only
# customer-facing services.
#
# Branding is NOT duplicated: config/01-ui.yaml is mounted in from the internal
# config directory, so the logo and theme have exactly one source.

name: gatus-public

services:
  gatus-public:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus-public
    restart: unless-stopped

    # NOTE: no healthcheck. The image is FROM scratch — no shell, no wget — so
    # any healthcheck reports unhealthy forever. The internal Gatus watches this
    # instance instead.

    environment:
      # Points into the read-only repo mount below, NOT at a /config bind.
      GATUS_CONFIG_PATH: /repo/config-public
      GATUS_LOG_LEVEL: INFO

    ports:
      - "3002:8080"

    volumes:
      # The whole repository, read-only. Deliberate: config-public/01-ui.yaml is
      # a symlink to ../config/01-ui.yaml so branding has one source, and a
      # relative symlink only resolves if both directories are inside the SAME
      # mount.
      #
      # Do not "simplify" this back to `./config-public:/config` plus a
      # single-file mount of ../config/01-ui.yaml. A single-file bind mount
      # binds an inode, and `git pull` replaces files rather than editing them
      # in place, so the container silently keeps serving the old branding while
      # the directory-mounted endpoint files update normally. That was observed
      # here on 2026-09-11.
      - .:/repo:ro
      - gatus-public-data:/data

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  gatus-public-data:
    name: gatus-public-data
