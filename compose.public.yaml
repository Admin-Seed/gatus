# Public status page — a SECOND Gatus instance.
#
# Why two instances: Gatus has no per-endpoint visibility control, so a single
# dashboard is either entirely public or entirely authenticated. The internal
# board (compose.yaml, port 3001) keeps basic auth and watches infrastructure;
# this one is unauthenticated, published at status.seedaps.com, and shows only
# customer-facing services.
#
# Branding is NOT duplicated: config/01-ui.yaml is mounted in from the internal
# config directory, so the logo and theme have exactly one source.

name: gatus-public

services:
  gatus-public:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus-public
    restart: unless-stopped

    # NOTE: no healthcheck. The image is FROM scratch — no shell, no wget — so
    # any healthcheck reports unhealthy forever. The internal Gatus watches this
    # instance instead.

    environment:
      GATUS_CONFIG_PATH: /config
      GATUS_LOG_LEVEL: INFO

    ports:
      - "3002:8080"

    volumes:
      - ./config-public:/config:ro
      - ./config/01-ui.yaml:/config/01-ui.yaml:ro
      - gatus-public-data:/data

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  gatus-public-data:
    name: gatus-public-data
